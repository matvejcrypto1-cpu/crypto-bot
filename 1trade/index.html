<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Analytics Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; 
            background: #090c10; 
            color: white; 
            font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; 
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            width: 90%; max-width: 360px;
            text-align: center;
            box-sizing: border-box;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }
        
        .main-title {
            font-size: 24px; 
            font-weight: 900; 
            line-height: 1.3;
            margin: 0 0 25px 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            width: 100%;
        }
        
        /* ЖЕСТКИЙ СТАТИЧНЫЙ КОНТЕЙНЕР (ВЫСОТА НЕ МЕНЯЕТСЯ) */
        .signal-display { 
            width: 100%;
            height: 285px; /* Увеличено с 250px до 285px, чтобы ничего не обрезалось */
            background: #0d1117; 
            border-radius: 18px; 
            border: 1px solid #1f2631; 
            margin-bottom: 25px; 
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        /* ЛАЗЕРНЫЙ СКАНЕР */
        .scanner-line { 
            position: absolute; top: 0; left: 0; width: 100%; height: 3px; 
            background: linear-gradient(to right, transparent, #00d2ff, transparent); 
            box-shadow: 0 0 15px #00d2ff; opacity: 0; 
            z-index: 5;
        }
        @keyframes scan { 
            0% { top: 0%; } 
            50% { top: 100%; }
            100% { top: 0%; } 
        }

        /* ПОЗИЦИОНИРОВАНИЕ КОНТЕНТА ВНУТРИ КАРКАСА */
        .content-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        #pair { font-size: 20px; font-weight: 700; color: #8a96ab; margin: 0; text-transform: uppercase; }
        
        #direction { font-size: 42px; font-weight: 900; margin: 15px 0; display: none; letter-spacing: 1px; text-transform: uppercase; }
        .up { color: #00ff88; text-shadow: 0 0 25px rgba(0,255,136,0.5); }
        .down { color: #ff3d71; text-shadow: 0 0 25px rgba(255,61,113,0.5); }
        
        /* ФИКСИРОВАННЫЙ БЛОК ИНФОРМАЦИИ (НЕ ДВИГАЕТ НИЧЕГО) */
        .info-row { display: none; gap: 10px; margin-top: 5px; justify-content: center; width: 100%; }
        .info-box { font-size: 12px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.03); padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); text-transform: uppercase; }
        .profit-color { color: #00d2ff; }

        .status-msg { font-size: 12px; color: #00d2ff; text-transform: uppercase; font-weight: 700; margin-top: 15px; text-align: center; width: 90%; }

        /* ПРОГРЕСС БАР */
        .progress-container {
            width: 80%; height: 6px; background: #161b22; 
            border-radius: 3px; margin-top: 15px; display: none; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #0072ff, #00d2ff);
            box-shadow: 0 0 8px #00d2ff;
            transition: width 0.1s linear;
        }

        /* КНОПКА ВСЕГДА НА ОДНОМ МЕСТЕ */
        .btn { 
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%); 
            border: none; width: 100%; padding: 19px; border-radius: 14px; 
            color: white; font-size: 16px; font-weight: 700; cursor: pointer; 
            text-transform: uppercase; box-shadow: 0 8px 25px rgba(0,114,255,0.25); 
            transition: 0.2s; letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { 
            background: #161b22; color: #3d4758; box-shadow: none; cursor: not-allowed; 
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="screen active" id="welcomeScreen">
        <div class="main-title">Добро пожаловать в<br>анализатор 1TRADE</div>
        <button class="btn" onclick="startApp()">Старт</button>
    </div>
    
    <div class="screen" id="terminalScreen">
        <div class="main-title">Удачной торговли</div>
        
        <div class="signal-display">
            <div class="scanner-line" id="line"></div>
            
            <div class="content-wrapper">
                <div id="pair">Ожидание запуска</div>
                <div id="direction">ВВЕРХ ⬆️</div>
                
                <div class="info-row" id="infoRow">
                    <div class="info-box" id="timeBox">ВРЕМЯ: 5 МИН</div>
                    <div class="info-box">ДОХОД: <span id="profit" class="profit-color">85%</span></div>
                </div>

                <div id="status" class="status-msg">Система готова к анализу</div>
                <div class="progress-container" id="pContainer"><div class="progress-bar" id="pBar"></div></div>
            </div>
        </div>

        <button class="btn" id="mainBtn" onclick="analyze()">Получить сигнал</button>
    </div>

</div>

<script>
    const marketData = [
        { pair: "USD/CAD OTC", profit: "87%" },
        { pair: "EUR/GBP OTC", profit: "85%" },
        { pair: "EUR/JPY OTC", profit: "85%" },
        { pair: "AUD/JPY OTC", profit: "81%" },
        { pair: "GBP/JPY OTC", profit: "81%" }
    ];

    const phases = [
        { text: "Анализируем волатильность рынка...", target: 15 },
        { text: "Фильтруем шумы OTC котировок...", target: 35 },
        { text: "Подбираем валютную пару...", target: 55 },
        { text: "Сканируем объемы рынка...", target: 75 },
        { text: "Ищем точку входа...", target: 90 },
        { text: "Формируем прогноз...", target: 100 }
    ];

    const timeOptions = ["3 МИН", "5 МИН", "10 МИН"];

    function startApp() {
        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('terminalScreen').classList.add('active');
    }

    function analyze() {
        const btn = document.getElementById('mainBtn');
        const line = document.getElementById('line');
        const status = document.getElementById('status');
        const dir = document.getElementById('direction');
        const infoRow = document.getElementById('infoRow');
        const pairText = document.getElementById('pair');
        const profitText = document.getElementById('profit');
        const timeBox = document.getElementById('timeBox');
        const pContainer = document.getElementById('pContainer');
        const pBar = document.getElementById('pBar');

        // Локаем кнопку и сбрасываем старый результат
        btn.disabled = true;
        dir.style.display = 'none';
        infoRow.style.display = 'none';
        pairText.innerText = "АНАЛИЗ РЫНКА...";
        
        line.style.opacity = '1';
        line.style.animation = 'scan 2s infinite linear';
        pContainer.style.display = 'block';
        pBar.style.width = '0%';

        // Генерируем рандомное время работы алгоритма от 10000мс (10с) до 20000мс (20с)
        const totalDuration = Math.floor(Math.random() * 11000) + 10000;
        const tickRate = 100; // Проверка каждые 100мс
        const totalTicks = totalDuration / tickRate;
        
        let currentProgress = 0;
        let phaseIndex = 0;
        let elapsedTicks = 0;

        let interval = setInterval(() => {
            elapsedTicks++;
            
            // Рассчитываем базовый шаг прогресса
            let baseStep = (100 / totalTicks);
            let rand = Math.random();
            
            // Делаем рваное движение (то быстрее, то зависает)
            if (rand > 0.85) {
                currentProgress += baseStep * 3; // Рывок вперед
            } else if (rand > 0.35) {
                currentProgress += baseStep * 0.8; // Медленное ползение
            } else {
                currentProgress += 0; // Полная заминка алгоритма
            }

            if (currentProgress > 100) currentProgress = 100;

            // Если время вышло, принудительно ставим 100%
            if (elapsedTicks >= totalTicks) currentProgress = 100;

            pBar.style.width = currentProgress + '%';

            // Меняем текст под текущий процент
            if (phaseIndex < phases.length && currentProgress >= phases[phaseIndex].target) {
                status.innerText = phases[phaseIndex].text;
                phaseIndex++;
            }

            if (currentProgress >= 100) {
                clearInterval(interval);
                setTimeout(showResult, 400);
            }
        }, tickRate); 

        function showResult() {
            line.style.animation = 'none';
            line.style.opacity = '0';
            pContainer.style.display = 'none';
            status.innerText = "Прогноз сформирован успешно:";

            const selected = marketData[Math.floor(Math.random() * marketData.length)];
            pairText.innerText = selected.pair;
            profitText.innerText = selected.profit;

            const randomTime = timeOptions[Math.floor(Math.random() * timeOptions.length)];
            timeBox.innerText = "ВРЕМЯ: " + randomTime;

            const isUp = Math.random() > 0.5;
            dir.innerText = isUp ? "ВВЕРХ ⬆️" : "ВНИЗ ⬇️";
            dir.className = isUp ? "up" : "down";
            
            dir.style.display = 'block';
            infoRow.style.display = 'flex';
            
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
